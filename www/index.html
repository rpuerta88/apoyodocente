<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAAD - Apoyo Docente Neuroeducativo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- CABECERA PRINCIPAL -->
    <header class="app-header">
        <h1>SAAD <span>NeuroAula</span></h1>
        <div class="estado-barra">
            <span class="badge">SQLite OK</span>
        </div>
    </header>

    <!-- PANEL OPERACIONAL DIARIO (En Caliente) -->
    <main class="contenedor-principal">
        
        <!-- Controles de Contexto de Aula -->
        <section class="tarjeta seccion-filtros">
            <h2>Gestión de Aula Diario</h2>
            <div class="grupo-control">
                <label>Curso y Sección</label>
                <select class="control-input">
                    <option>5TO AÑO A</option>
                    <option>5TO AÑO B</option>
                    <option>5TO AÑO C</option>
                </select>
            </div>
            
            <div class="grupo-control">
                <label>Sesión / Clase de Hoy</label>
                <div class="linea-accion">
                    <select class="control-input">
                        <option>Polinomios</option>
                        <option>Cónicas</option>
                        <option>derivadas</option>
                    </select>
                </div>
            </div>
        </section>
    <script src="register.js"></script>
</body>
</html>
