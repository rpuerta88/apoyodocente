<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAAD - Apoyo Docente Neuroeducativo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- CABECERA PRINCIPAL -->
    <header class="app-header">
        <h1>SAAD <span>NeuroAula</span></h1>
        <div class="estado-barra">
            <span class="badge">SQLite OK</span>
        </div>
    </header>

    <!-- PANEL OPERACIONAL DIARIO (En Caliente) -->
    <main class="contenedor-principal">
        
        <!-- Controles de Contexto de Aula -->
        <section class="tarjeta seccion-filtros">
            <h2>Gestión de Aula Diario</h2>
            <div class="grupo-control">
                <label>Curso y Sección</label>
                <select class="control-input">
                    <option>5TO AÑO A</option>
                    <option>5TO AÑO B</option>
                    <option>5TO AÑO C</option>
                </select>
            </div>
            
            <div class="grupo-control">
                <label>Sesión / Clase de Hoy</label>
                <div class="linea-accion">
                    <select class="control-input">
                        <option>Polinomios</option>
                        <option>Cónicas</option>
                        <option>derivadas</option>
                    </select>
                </div>
            </div>
        </section>
<!-- PENDIENTE HACER EL CONTENEDOR O SECCION DESTINADA A LA ADMINISTRACIÓN DEL SISTEMA -->
<!-- SECCIÓN ADMINISTRATIVA: REGISTRO DE CURSOS Y SECCIONES -->
<div id="seccionCursos" class="panel-administrativo">
    <h3>🏛️ Registro de Cursos y Secciones</h3>
    
    <!-- Formulario de Registro Rápido -->
    <form id="formCursos" class="formulario-lineal">
        <div class="campo-grupo no-margin">
            <label for="curso_seccion">Curso y Sección:</label>
            <input type="text" id="curso_seccion" placeholder="Ej: 5TO AÑO A" required autocomplete="off">
        </div>
        <button type="submit" class="btn-agregar-curso">➕ Añadir</button>
    </form>

    <!-- Lista Dinámica Interactiva -->
    <div class="contenedor-lista-cursos">
        <h4>Cursos Registrados</h4>
        <ul id="listaCursosActivos" class="lista-interactiva">
            <!-- Se puebla dinámicamente desde SQLite -->
            <li class="lista-vacia">No hay cursos registrados en el sistema.</li>
        </ul>
    </div>
</div>


<!-- FORMULARIOS MODALES -->
<!-- Modal Emergente para Configuración Administrativa de Escolaridad -->
<div id="modalEscolaridad" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h2 id="modalTitulo">Configuración de Escolaridad</h2>
        <p id="modalMensaje" class="alerta-texto" style="display: none;">
            ⚠️ No se detectó ninguna escolaridad vigente para la fecha actual. Por favor, configure el período.
        </p>
        
        <form id="formEscolaridad">
            <!-- Campo oculto para cuando estemos editando -->
            <input type="hidden" id="escolaridad_id" value="">

            <div class="campo-grupo">
                <label for="esc_nombre">Año Escolar / Escolaridad:</label>
                <input type="text" id="esc_nombre" placeholder="Ej: 2026-2027" required>
            </div>

            <div class="campo-grupo">
                <label for="esc_profesor">Nombre del Profesor:</label>
                <input type="text" id="esc_profesor" placeholder="Nombre y Apellido" required>
            </div>

            <div class="campo-grupo">
                <label for="esc_area">Área de Formación:</label>
                <input type="text" id="esc_area" placeholder="Ej: Matemáticas, GHC" required>
            </div>

            <div class="campo-grupo">
                <label for="esc_peic">Nombre del PEIC:</label>
                <input type="text" id="esc_peic" placeholder="Proyecto Educativo Integral Comunitario" required>
            </div>

            <div class="dos-columnas">
                <div class="campo-grupo">
                    <label for="esc_inicio">Fecha de Inicio:</label>
                    <input type="date" id="esc_inicio" required>
                </div>
                <div class="campo-grupo">
                    <label for="esc_cierre">Fecha de Cierre:</label>
                    <input type="date" id="esc_cierre" required>
                </div>
            </div>

            <div class="modal-botones">
                <button type="submit" class="btn-guardar">Guardar Configuración</button>
                <button type="button" id="btnCerrarModal" class="btn-cancelar" style="display: none;" onclick="AppEscolaridad.cerrarModal()">Cancelar</button>
            </div>
        </form>
    </div>
</div>

<!-- Botón flotante o administrativo en tu interfaz para editar cuando se requiera -->
<button type="button" class="btn-editar-adm" onclick="AppEscolaridad.abrirParaEditar()">⚙️ Editar Escolaridad Activa</button>
    <script src="register.js"></script>
</body>
</html>
