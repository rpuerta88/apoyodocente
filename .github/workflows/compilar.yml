name: Compilador Automatizado de APK - Apoyo Docente

on:
  push:
    branches: [ main ]  # Se dispara automáticamente al hacer "git push" a la rama main

jobs:
  build:
    name: Compilar Proyecto Nativo Android
    runs-on: ubuntu-latest

    steps:
    # 1. Clonar el repositorio de GitHub en el servidor virtual
    - name: Clonar Codigo Fuente
      uses: actions/checkout@v4

    # 2. Configurar NodeJS v22 (Requisito estricto de Capacitor v6)
    - name: Configurar Entorno NodeJS v22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    # 3. Configurar Java JDK 17 (Requisito para compilar Gradle en Android moderno)
    - name: Configurar Entorno Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 4. Instalar las dependencias del proyecto (Capacitor y complementos)
    - name: Instalar Dependencias de Node
      run: npm install

    # 5. Sincronizar los archivos web (index.html, app.js, styles.css) con el entorno Android
    - name: Sincronizar Recursos Web con Capacitor
      run: npx cap sync android

    # 6. Dar permisos de ejecución al script de compilación nativo (Gradle)
    - name: Otorgar Permisos de Ejecucion a Gradle
      run: chmod +x android/gradlew

    # 7. Compilar el APK en modo Depuración (Debug), ideal para instalar directo en tu teléfono
    - name: Compilar APK Nativo con Gradle
      run: |
        cd android
        ./gradlew assembleDebug

    # 8. Guardar el archivo APK resultante y ponerlo disponible para su descarga
    - name: Cargar APK como Artefacto Descargable
      uses: actions/upload-artifact@v4
      with:
        name: ApoyoDocente-APK-Prueba
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7  # El archivo estará disponible para descargar por 7 días
