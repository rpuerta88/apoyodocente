name: Compilador Automatizado de APK - Apoyo Docente

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Compilar Proyecto Nativo Android
    runs-on: ubuntu-latest

    steps:
    # 1. Clonar el repositorio usando la versión v4
    - name: Clonar Codigo Fuente
      uses: actions/checkout@v4

    # 2. Configurar NodeJS v22 (Requisito estricto de Capacitor CLI)
    - name: Configurar Entorno NodeJS 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm' # Optimiza el tiempo de compilación guardando dependencias en caché

    # 3. Verificar que la versión correcta quedó instalada
    - name: Mostrar versiones Node/NPM
      run: |
        node -v
        npm -v

    # 4. Configurar Java JDK 21 (Garantiza máxima estabilidad con Gradle y Android)
    - name: Configurar Entorno Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    # 5. Instalar las dependencias de Node
    - name: Instalar Dependencias de Node
      run: npm install --legacy-peer-deps

    # 6. Compilar los recursos Web (Si el script build existe en tu package.json)
    - name: Compilar Proyecto Web (Generar carpetas dist/www)
      run: npm run build --if-present

    # 7. CORRECCIÓN CRÍTICA: Forzar el enlace nativo de plugins en Gradle
    # 'cap update' inyecta los plugins de node_modules en las dependencias de Gradle de Android
    - name: Actualizar e Inyectar Plugins Nativos
      run: npx cap update android

    # 8. Sincronizar los recursos web reales con el entorno nativo de Android
    - name: Sincronizar Recursos Web con Capacitor
      run: npx cap sync android
      
    # 9. Otorgar permisos de ejecución al script nativo de Gradle
    - name: Otorgar Permisos de Ejecucion a Gradle
      run: chmod +x android/gradlew

     # 10. Compilar el APK en modo Debug nativo (Optimizado para estabilidad)
    - name: Compilar APK Nativo con Gradle
      env:
        GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m" # Previene bloqueos por falta de memoria
      run: |
        cd android
        ./gradlew assembleDebug

    # 11. Cargar el resultado final para su descarga directa
    - name: Cargar APK como Artefacto Descargable
      uses: actions/upload-artifact@v4
      with:
        name: ApoyoDocente-APK-Prueba
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
