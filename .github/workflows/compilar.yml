name: Compilador Automatizado de APK - Apoyo Docente

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Compilar Proyecto Nativo Android
    runs-on: ubuntu-latest

    steps:
    # 1. Clonar el código fuente limpio (incluyendo tu nueva carpeta android)
    - name: Clonar Codigo Fuente
      uses: actions/checkout@v4

    # 2. Configurar NodeJS v24 (Actualizado a tu versión actual)
    - name: Configurar Entorno NodeJS 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    # 3. Mostrar versiones de control
    - name: Mostrar versiones Node/NPM
      run: |
        node -v
        npm -v

    # 4. Configurar Java JDK 21
    - name: Configurar Entorno Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    # 5. Instalar dependencias de Node
    - name: Instalar Dependencias de Node
      run: npm install --legacy-peer-deps

    # 6. Sincronizar recursos y plugins de Capacitor
    # Al tener ya la carpeta 'android' en el repositorio, solo copiamos la carpeta www y sincronizamos plugins
    - name: Sincronizar Recursos Web con Capacitor
      run: |
        npx cap copy android
        npx cap sync android
      
    # 7. Otorgar permisos de ejecución al script nativo de Gradle
    - name: Otorgar Permisos de Ejecucion a Gradle
      run: chmod +x android/gradlew

    # 8. Compilar el APK en modo Debug nativo
    - name: Compilar APK Nativo con Gradle
      env:
        GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"
      run: |
        cd android
        ./gradlew assembleDebug

    # 9. Cargar el resultado final para su descarga directa
    - name: Cargar APK como Artefacto Descargable
      uses: actions/upload-artifact@v4
      with:
        name: ApoyoDocente-APK-Prueba
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
