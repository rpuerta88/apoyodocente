name: Compilador Automatizado de APK - Apoyo Docente

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Compilar Proyecto Nativo Android
    runs-on: ubuntu-latest

    steps:
    # 1. Clonar el repositorio usando la versión v4 actualizada
    - name: Clonar Codigo Fuente
      uses: actions/checkout@v4

    # 2. Configurar NodeJS v22 de forma estricta
    - name: Configurar Entorno NodeJS v22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # 3. Configurar Java JDK 17 usando la acción moderna v4 con distribución estandarizada
    - name: Configurar Entorno Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'  # Distribución estándar altamente compatible con Android Studio y Gradle
        java-version: '17'

    # 4. Instalar las dependencias omitiendo los bloqueos estrictos de peer-dependencies de plugins móviles
    - name: Instalar Dependencias de Node
      run: npm install --legacy-peer-deps

    # 5. Sincronizar los recursos web con Capacitor
    - name: Sincronizar Recursos Web con Capacitor
      run: npx cap sync android

    # 6. Otorgar permisos de ejecución al script nativo de Gradle
    - name: Otorgar Permisos de Ejecucion a Gradle
      run: chmod +x android/gradlew

    # 7. Compilar el APK en modo Debug nativo
    - name: Compilar APK Nativo con Gradle
      run: |
        cd android
        ./gradlew assembleDebug

    # 8. Cargar el resultado final para que puedas descargarlo e instalarlo
    - name: Cargar APK como Artefacto Descargable
      uses: actions/upload-artifact@v4
      with:
        name: ApoyoDocente-APK-Prueba
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
