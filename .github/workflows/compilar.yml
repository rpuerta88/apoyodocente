name: Compilador Automatizado de APK - Apoyo Docente

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Compilar Proyecto Nativo Android
    runs-on: ubuntu-latest

    steps:
    # 1. Clonar el código fuente limpio
    - name: Clonar Codigo Fuente
      uses: actions/checkout@v4

    # 2. Configurar NodeJS v22 (Requisito estricto de Capacitor CLI)
    - name: Configurar Entorno NodeJS 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    # 3. Mostrar versiones de control
    - name: Mostrar versiones Node/NPM
      run: |
        node -v
        npm -v

    # 4. Configurar Java JDK 21
    - name: Configurar Entorno Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    # 5. Instalar dependencias de Node (incluyendo los plugins de SQLite)
    - name: Instalar Dependencias de Node
      run: npm install --legacy-peer-deps

    # 6. Compilar recursos web (Generar carpetas dist o www)
    - name: Compilar Proyecto Web
      run: npm run build --if-present

    # 7. GENERACIÓN LIMPIA: Crear la estructura nativa de Android desde cero
    # Esto inyecta automáticamente todos los plugins de JavaScript en código Java nativo
    - name: Crear Plataforma Nativa Android
      run: npx cap add android

    # 8. Sincronizar recursos finales
    - name: Sincronizar Recursos Web con Capacitor
      run: npx cap sync android
      
    # 9. Otorgar permisos de ejecución al script nativo de Gradle generado
    - name: Otorgar Permisos de Ejecucion a Gradle
      run: chmod +x android/gradlew

    # 10. Compilar el APK en modo Debug nativo
    - name: Compilar APK Nativo con Gradle
      env:
        GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"
      run: |
        cd android
        ./gradlew assembleDebug

    # 11. Cargar el resultado final para su descarga directa
    - name: Cargar APK como Artefacto Descargable
      uses: actions/upload-artifact@v4
      with:
        name: ApoyoDocente-APK-Prueba
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7

