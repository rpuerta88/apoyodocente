name: Compilador Automatizado de APK - Apoyo Docente

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Compilar Proyecto Nativo Android
    runs-on: ubuntu-latest

    steps:
    # 1. Clonar el repositorio usando la versión v4
    - name: Clonar Codigo Fuente
      uses: actions/checkout@v4

    # 2. Configurar NodeJS v22 de forma estricta
    - name: Configurar Entorno NodeJS v22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # 3. CORRECCIÓN: Configurar Java JDK 17 real para máxima estabilidad con Gradle y Android
    - name: Configurar Entorno Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17' # Cambiado a 17 para evitar errores silenciosos de bytecode nativo

    # 4. Instalar las dependencias
    - name: Instalar Dependencias de Node
      run: npm install --legacy-peer-deps

    # 5. AGREGADO: Compilar los recursos Web (Asegúrate de que este script exista en tu package.json)
    # Si usas JS vanilla sin empaquetador y tu carpeta de salida ya existe, puedes omitir este paso.
    - name: Compilar Proyecto Web (Generar carpetas dist/www)
      run: npm run build --if-present

    # 6. Sincronizar los recursos web reales y actualizados con Capacitor
    - name: Sincronizar Recursos Web con Capacitor
      run: npx cap sync android

    # 7. Otorgar permisos de ejecución al script nativo de Gradle
    - name: Otorgar Permisos de Ejecucion a Gradle
      run: chmod +x android/gradlew

    # 8. Compilar el APK en modo Debug nativo
    - name: Compilar APK Nativo con Gradle
      run: |
        cd android
        ./gradlew assembleDebug

    # 9. Cargar el resultado final para que puedas descargarlo e instalarlo
    - name: Cargar APK como Artefacto Descargable
      uses: actions/upload-artifact@v4
      with:
        name: ApoyoDocente-APK-Prueba
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
